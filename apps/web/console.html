<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ZYNTRA Console</title>
  <link rel="stylesheet" href="styles.css" />
  <style>
    .panel { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 1rem; margin: 1rem 0; }
    input, textarea { width: 100%; padding: 0.55rem; margin: 0.35rem 0 0.75rem; border-radius: 8px; border: 1px solid var(--border); background: #0e1528; color: var(--text); }
    label { font-size: 0.9rem; color: var(--muted); }
    .row { display: grid; gap: 0.75rem; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
    pre.out { white-space: pre-wrap; word-break: break-word; max-height: 280px; overflow: auto; }
    .warn { color: #fbbf24; font-size: 0.9rem; }
    nav a { margin-left: 1rem; color: var(--accent); }
  </style>
</head>
<body>
  <header class="hero" style="padding-bottom:1rem">
    <nav><a href="index.html">الرئيسية</a><a href="console.html">Console</a></nav>
    <h1>ZYNTRA Console</h1>
    <p class="lead">تسجيل · وكلاء · تشغيل عبر Agents → Gateway</p>
    <p class="warn">مفتاح API في localStorage لهذا المتصفح فقط.</p>
  </header>
  <main>
    <section class="panel">
      <h2>الاتصال</h2>
      <div class="row">
        <div><label>Agents URL</label><input id="agentsUrl" value="http://localhost:8081" /></div>
        <div><label>API Key</label><input id="apiKey" type="password" placeholder="zyn_..." /></div>
      </div>
      <button class="btn primary" type="button" id="saveCfg">حفظ الإعدادات</button>
    </section>
    <section class="panel">
      <h2>تسجيل</h2>
      <label>البريد</label>
      <input id="email" type="email" placeholder="you@example.com" />
      <button class="btn" type="button" id="registerBtn">تسجيل</button>
      <pre class="out" id="regOut"></pre>
    </section>
    <section class="panel">
      <h2>الوكلاء</h2>
      <div class="row">
        <div><label>الاسم</label><input id="agentName" value="assistant" /></div>
        <div><label>النموذج</label><input id="agentModel" value="gpt-4o-mini" /></div>
      </div>
      <label>System prompt</label>
      <textarea id="agentPrompt" rows="2">You are a helpful ZYNTRA agent.</textarea>
      <button class="btn primary" type="button" id="createAgent">إنشاء</button>
      <button class="btn" type="button" id="listAgents">تحديث القائمة</button>
      <pre class="out" id="agentsOut"></pre>
    </section>
    <section class="panel">
      <h2>تشغيل</h2>
      <label>Agent ID</label>
      <input id="runAgentId" type="number" min="1" />
      <label>الرسالة</label>
      <textarea id="runInput" rows="3">مرحبا، عرّف بنفسك باختصار.</textarea>
      <button class="btn primary" type="button" id="runBtn">تشغيل</button>
      <pre class="out" id="runOut"></pre>
    </section>
  </main>
  <script src="console.js"></script>
</body>
</html>
