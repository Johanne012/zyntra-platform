name: CI

on:
  push:
    branches: [main, "feat/**", "fix/**", "improve/**"]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gateway:
    name: Gateway
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/gateway
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Python
        run: uv python install 3.12
      - name: Install
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check app tests
      - name: Format
        run: uv run ruff format --check app tests
      - name: Test
        run: uv run pytest -q

  agents:
    name: Agents
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: services/agents
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v4
      - name: Python
        run: uv python install 3.12
      - name: Install
        run: uv sync --extra dev
      - name: Ruff
        run: uv run ruff check app tests
      - name: Format
        run: uv run ruff format --check app tests
      - name: Test
        run: uv run pytest -q

  web-structure:
    name: Web structure
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Required web files
        run: |
          test -f apps/web/index.html
          test -f apps/web/app.js
          test -f apps/web/styles.css
          test -f apps/web/console.html
          test -f apps/web/console.js
          test -f packages/shared/contracts.md
          test -f docker-compose.yml
